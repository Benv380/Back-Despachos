name: CI/CD - Backend Despachos

on:
  push:
    branches:
      - deploy

env:
  IMAGE_NAME: backend-despachos
  CONTAINER_NAME: api_despachos

jobs:

  build-and-push:
    name: Build y Push a Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y Push de la imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy en EC2 Backend (via jump host Frontend)
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configurar clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_FRONTEND_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy en EC2 Backend via jump host
        run: |
          ssh -i ~/.ssh/id_rsa \
            -o ProxyJump=ubuntu@${{ secrets.EC2_FRONTEND_HOST }} \
            -o StrictHostKeyChecking=no \
            ubuntu@${{ secrets.EC2_BACKEND_PRIVATE_IP }} \
            'echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/backend-despachos:latest
            docker rm -f api_despachos || true
            cd ~/app/backend
            docker compose down || true
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f'

            
